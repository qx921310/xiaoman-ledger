name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 类型 / 测试 / 令牌 / 构建
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: 安装依赖
        run: npm ci --no-audit --no-fund

      # 一条命令跑完全部闸门：typecheck → test → icons:check → ui:contrast → ui:tokens → build
      - name: 质量闸门（npm run check）
        run: npm run check
